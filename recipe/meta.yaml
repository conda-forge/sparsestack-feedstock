{% set name = "sparsestack" %}
{% set version = "0.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sparsestack-{{ version }}.tar.gz
  sha256: 13c2edea1ad8be376e9fa28ce49231ceded9cd114c06d1335a74e0b96a2c6df9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry-core
  run:
    - numba >=0.61.0
    - numpy >=2.1.0
    - python >={{ python_min }},<3.15
    - scipy >=1.15.3,<1.17

test:
  imports:
    - sparsestack
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/florian-huber/stacked-sparse-array
  summary: Python library to handle stacks of sparse COO arrays efficiently.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hechth
    - florian-huber
